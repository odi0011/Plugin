name: Verify marketplace signatures

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out marketplace artifacts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: openssl
      - name: Verify published signatures and regression cases
        run: |
          php tools/verify-signatures-standalone.php
          php tools/test-signatures.php
